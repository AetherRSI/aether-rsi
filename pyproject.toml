[build-system]
requires = ["setuptools>=77"]   # 77: license as an SPDX expression (PEP 639); 62.3: "**" in package-data
build-backend = "setuptools.build_meta"

[project]
name = "aether-rsi"
dynamic = ["version"]
description = "A small, local workbench for coding agents: a message queue, a task list and a file tree. Everything else is an extension."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
aether = "aether.__main__:cli"

[tool.setuptools]
packages = ["aether"]

[tool.setuptools.package-data]
aether = ["static/*", "fallback/*/*/*", "sample_project/*", "sample_project/**/*"]   # sample_project: what `aether init` copies out

[tool.setuptools.dynamic]
version = { attr = "aether.VERSION" }
