<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 12px 16px 60px; font: 13px/1.55 system-ui, sans-serif; }
  body.dark { background: #15171c; color: #e6e7ea; }
  .hint { font-size: 12px; color: #888; margin: 0 0 8px; }
  ol { margin: 0; padding-left: 4.5em; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  li { white-space: pre-wrap; word-break: break-all; cursor: pointer; }
  li::marker { color: #999; font-size: 11px; }
  li:hover { background: rgba(99, 102, 241, .12); }
  #tip { position: absolute; font-size: 13px; line-height: 1.2; padding: 2px 6px; border: 1px solid #c9cfdd; border-radius: 6px; background: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
  body.dark #tip { background: #262a33; border-color: #444; }
  #tip[hidden] { display: none; }
</style>
</head>
<body>
<p class="hint" id="hint"></p>
<ol id="doc"></ol>
<button type="button" id="tip" title="Quote the selection" aria-label="Quote the selection" hidden>📎</button>
<script src="aether-icons.js"></script>
<script src="aether-sdk.js"></script>
<script>
// "match": ["*"] ―― the core opens here only the file types no other preview takes. "binary": true so this page decides
// whether the bytes are text (strict UTF-8, no NUL) instead of showing a decoded jumble.
const SHOW = 2_000_000, LINES = 20000;
let name = "";
document.getElementById("tip").replaceChildren(mui("AttachFile"));   // one-colour icons (the shell's aether-icons.js)
const DL = { id: "dl", icon: "Download", label: "Download", title: "Download the file", run: () => aether.download() };   // the shell's own 📎 quotes the whole file
// Not text: ask the agent for a copy the panel can show. The page only fills ③ (the file quoted + the request); the person sends it
const convert = (path) => () => {
  aether.quote("", "");
  aether.send(`Convert “${path}” into a format the Files panel can preview (Markdown .md for documents and sheets, PDF when the layout matters, PNG for drawings) and save it next to the original under the same name. Keep the original.`);
};
aether.on("theme", (d) => document.body.classList.toggle("dark", !!d.dark));
aether.on("open", (d) => {
  name = d.name;
  aether.bar([DL]);
  const doc = document.getElementById("doc"), hint = document.getElementById("hint");
  doc.replaceChildren();
  if (d.error) { hint.textContent = d.error; return; }
  const bytes = new Uint8Array(d.data), head = bytes.subarray(0, SHOW);
  let text;
  try { if (head.includes(0)) throw 0; text = new TextDecoder("utf-8", { fatal: true }).decode(head, { stream: bytes.length > SHOW }); }
  catch {
    aether.bar([{ id: "conv", icon: "Transform", label: "Convert to viewable", title: "Put a request in ③ for the agent to make a copy this panel can preview (you send it)", primary: true, run: convert(d.path) }, DL]);
    hint.replaceChildren(muiText(`“${name}” is not text (${bytes.length.toLocaleString()} bytes). Press {Transform} Convert to viewable to ask the agent for a copy this panel can show, quote it ({AttachFile} above), or {Download} download it.`));
    return;
  }
  const lines = text.replace(/\r\n?/g, "\n").replace(/\n$/, "").split("\n");
  const cut = bytes.length > SHOW || lines.length > LINES;
  hint.replaceChildren(muiText(`Click a line to quote it, or select text and press the {AttachFile} beside it.${cut ? ` Showing the first ${Math.min(lines.length, LINES).toLocaleString()} lines.` : ""}`));
  doc.append(...lines.slice(0, LINES).map((l) => { const li = document.createElement("li"); li.textContent = l || " "; return li; }));
});
document.getElementById("doc").addEventListener("click", (e) => {
  const li = e.target.closest("li");
  if (!li || String(getSelection())) return;
  const n = [...li.parentNode.children].indexOf(li) + 1;
  aether.quote(`${name}:${n}`, li.textContent);
});
// A 📎 beside the selection quotes it (not in the shell's bar: there 📎 already quotes the whole file)
const tip = document.getElementById("tip");
tip.addEventListener("mousedown", (e) => e.preventDefault());   // keep the selection while pressing
tip.addEventListener("click", () => {
  const t = String(getSelection()).trim();
  if (t) aether.quote(`${name} (selection)`, t);
  getSelection().removeAllRanges(); tip.hidden = true;
});
document.addEventListener("selectionchange", () => {
  const s = getSelection();
  if (!s.rangeCount || !String(s).trim() || !document.getElementById("doc").contains(s.anchorNode)) { tip.hidden = true; return; }
  const r = s.getRangeAt(s.rangeCount - 1).getBoundingClientRect(), max = document.documentElement.clientWidth - 40;
  tip.style.left = `${Math.max(0, Math.min(r.right + 4, max)) + scrollX}px`;
  tip.style.top = `${r.bottom + 4 + scrollY}px`;
  tip.hidden = false;
});
</script>
</body>
</html>
