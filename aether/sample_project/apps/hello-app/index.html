<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px 20px; }
  body.dark { background: #15171c; color: #e6e7ea; }
  li { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; }
  li b { min-width: 2.2em; text-align: right; color: #6366f1; }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #c7c9d1; background: transparent; cursor: pointer; }
  .hint { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h2>💡 Ideas board</h2>
<p class="hint">A folder that is an app: this page + <code>data.json</code> + <code>AGENTS.md</code> (rules for the agent).<br>
Click an idea to quote it. The button only drafts a message ―― you send it.</p>
<ul id="list"><li>Loading…</li></ul>
<button id="ask" type="button">✍️ Ask the agent to add an idea</button>
<script src="aether-sdk.js"></script>
<script>
aether.on("theme", (d) => document.body.classList.toggle("dark", !!d.dark));
async function load() {
  const list = document.getElementById("list");
  try {
    const { ideas } = JSON.parse(await aether.read("data.json"));
    list.replaceChildren(...ideas.sort((a, b) => b.votes - a.votes).map((it) => {
      const li = document.createElement("li");
      li.innerHTML = `<b>${it.votes}</b><span></span>`;
      li.querySelector("span").textContent = it.title;
      li.addEventListener("click", () => aether.quote(it.title, JSON.stringify(it)));
      return li;
    }));
  } catch (e) { list.textContent = e.message; }
}
aether.on("open", load);
aether.on("rev", load);   // something changed in the core (e.g. a job finished): read the data again
document.getElementById("ask").addEventListener("click", () => aether.send("Add an idea to the ideas board: "));
</script>
</body>
</html>
