<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 13px/1.55 system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #1f2328; background: #fff; }
  body.dark { background: #15171c; color: #e6e7ea; }
  .hint { flex: none; font-size: 12px; color: #6b7280; margin: 0; padding: 6px 12px; }
  .hint.err { color: #b91c1c; } body.dark .hint { color: #9aa0aa; } body.dark .hint.err { color: #fca5a5; }
  #stage { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template: 100% / 100%; place-items: center; }   /* the one cell is the stage: fit = max 100 % of it */
  #stage.zoomed { grid-template: auto / auto; place-items: safe center; }   /* zoomed: the cell grows with the image and scrolls */
  #stage[hidden] { display: none; }
  #stage.video { background: #000; overflow: hidden; }
  #stage.audio { place-items: center; padding: 24px; }
  #stage.bg-check { background: repeating-conic-gradient(#e5e7eb 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  body.dark #stage.bg-check { background: repeating-conic-gradient(#2a2e36 0 25%, #1d2027 0 50%) 0 0 / 16px 16px; }
  #stage.bg-white { background: #fff; } #stage.bg-black { background: #000; }
  #stage { position: relative; }
  #pin { position: absolute; width: 15px; height: 15px; margin: -7px 0 0 -7px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1.5px #ef4444, inset 0 0 0 1.5px #ef4444; pointer-events: none; }
  #pin[hidden] { display: none; }
  #stage.grab { cursor: grab; } #stage.grabbing { cursor: grabbing; }
  #stage > * { grid-area: 1 / 1; }
  img { display: block; user-select: none; -webkit-user-drag: none; }
  img.fit { max-width: 100%; max-height: 100%; object-fit: contain; }
  img.px { image-rendering: pixelated; }
  video { display: block; max-width: 100%; max-height: 100%; outline: none; }
  .abox { width: min(640px, 100%); } audio { display: block; width: 100%; }
  .disc { font-size: 56px; text-align: center; margin-bottom: 10px; }
  #now { flex: none; min-height: 26px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7280; padding: 4px 12px 8px; display: flex; align-items: center; gap: 8px; }
  body.dark #now { color: #9aa0aa; }
  #now i { display: inline-block; width: 12px; height: 12px; border: 1px solid #9aa0aa; border-radius: 2px; }
  .spin { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; border-radius: 50%; border: 2px solid #c9d6f5; border-top-color: #2f6fec; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<p class="hint" id="hint"><span class="spin"></span>Loading…</p>
<div id="stage" hidden></div>
<div id="now"></div>
<script src="aether-icons.js"></script>
<script src="aether-sdk.js"></script>
<script>
// media-preview: what the browser itself can show ―― images, video and audio. The core hands the bytes over ("binary": true,
// up to 50 MB); they become a Blob URL, since the frame's opaque origin cannot load the file itself. An SVG goes in <img>, so its
// scripts never run.
// Image: fit / zoom (⌘ or Ctrl + wheel), drag to pan, the pixel under the pointer below. A click pins a pixel (📌) and the bar's 📎 quotes it
// (quoting on the click itself would move the focus to the composer, so the keys below stop reaching the page).
// Video / audio: the native controls, plus speed, loop, frame steps (video) and 📎 to quote the current time.
// Keys: Space play/pause · ← → 1 s · , . one frame · L loop · (image) + − 0.
const $ = (s) => document.querySelector(s);
const hint = $("#hint"), stage = $("#stage"), now = $("#now");
const TYPES = {
  image: { png: "image/png", apng: "image/apng", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", avif: "image/avif", bmp: "image/bmp", ico: "image/x-icon", svg: "image/svg+xml" },
  video: { mp4: "video/mp4", m4v: "video/mp4", mov: "video/mp4", webm: "video/webm", ogv: "video/ogg" },   // .mov as mp4: Chrome plays H.264 .mov only when told so
  audio: { mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", oga: "audio/ogg", opus: "audio/ogg", m4a: "audio/mp4", aac: "audio/aac", flac: "audio/flac", weba: "audio/webm" },
};
const RATES = ["0.25", "0.5", "1", "1.5", "2"];
const ZOOMS = ["fit", "0.25", "0.5", "1", "2", "4", "8"];
const BGS = { check: "Checker", white: "White", black: "Black" };
let name = "", url = "", size = 0, kind = "", gen = 0, el = null;
let st = { rate: "1", loop: false, zoom: "fit", bg: "check" };   // remembered across files (aether.save)

const kindOf = (n) => { const e = (n.split(".").pop() || "").toLowerCase(); for (const k in TYPES) if (TYPES[k][e]) return [k, TYPES[k][e]]; return ["", ""]; };
const mb = (b) => (b >= 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1e3))} KB`);
const fmt = (t) => { if (!isFinite(t)) return "--:--"; const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, "0")}`; };
const save = () => aether.save(st);
function err(t) { hint.className = "hint err"; hint.textContent = t; stage.hidden = true; now.textContent = ""; }

// ───────── image ─────────
let pinned = null;   // the pixel a click pinned: {x, y, rgb}
const pin = document.createElement("div"); pin.id = "pin"; pin.hidden = true;
let px = null;   // a canvas copy of the image, to read the colour under the pointer (none for SVG: it has no pixels of its own)
function zoomImg(z, keepAt) {
  if (!ZOOMS.includes(z)) return;
  const img = el, fit = z === "fit";
  const cx = keepAt ? keepAt.x / img.clientWidth : 0.5, cy = keepAt ? keepAt.y / img.clientHeight : 0.5;
  st.zoom = z; save();
  img.classList.toggle("fit", fit);
  img.style.width = fit ? "" : `${img.naturalWidth * +z}px`;
  img.style.height = fit ? "" : `${img.naturalHeight * +z}px`;
  img.classList.toggle("px", !fit && +z >= 2);
  stage.classList.toggle("zoomed", !fit);
  stage.scrollLeft = cx * img.clientWidth - (keepAt ? keepAt.cx : stage.clientWidth / 2);
  stage.scrollTop = cy * img.clientHeight - (keepAt ? keepAt.cy : stage.clientHeight / 2);
  grabbable(); placePin(); imgInfo(null); bar();
}
function placePin() {
  pin.hidden = !pinned;
  if (!pinned) return;
  pin.style.left = `${el.offsetLeft + ((pinned.x + 0.5) / el.naturalWidth) * el.clientWidth}px`;
  pin.style.top = `${el.offsetTop + ((pinned.y + 0.5) / el.naturalHeight) * el.clientHeight}px`;
}
function quotePixel() {
  const p = pinned;
  if (p) aether.quote(`${name} (${p.x}, ${p.y})`, `${name} (${el.naturalWidth}×${el.naturalHeight}) pixel (${p.x}, ${p.y})${p.rgb ? ` · ${hex(p.rgb)} RGB(${p.rgb.slice(0, 3).join(", ")})` : ""}`);
}
const zoomNow = () => (st.zoom === "fit" ? el.clientWidth / el.naturalWidth : +st.zoom);
function zoomBy(dir, keepAt) {
  const cur = zoomNow(), steps = ZOOMS.slice(1).map(Number);
  const next = dir > 0 ? steps.find((z) => z > cur * 1.01) : [...steps].reverse().find((z) => z < cur * 0.99);
  if (next) zoomImg(String(next), keepAt);
}
const grabbable = () => stage.classList.toggle("grab", kind === "image" && (stage.scrollWidth > stage.clientWidth || stage.scrollHeight > stage.clientHeight));
function pixelAt(e) {
  const r = el.getBoundingClientRect(), x = Math.floor(((e.clientX - r.left) / r.width) * el.naturalWidth), y = Math.floor(((e.clientY - r.top) / r.height) * el.naturalHeight);
  if (x < 0 || y < 0 || x >= el.naturalWidth || y >= el.naturalHeight) return null;
  let rgb = null;
  try { if (px) { const d = px.getImageData(x, y, 1, 1).data; rgb = [d[0], d[1], d[2], d[3]]; } } catch { px = null; }
  return { x, y, rgb };
}
const hex = (c) => `#${c.slice(0, 3).map((v) => v.toString(16).padStart(2, "0")).join("")}`;
function imgInfo(p) {
  const z = `${Math.round(zoomNow() * 100)}%`;
  if (!p && !pinned) { now.replaceChildren(muiText(`${z} · hover a pixel for its position and color · click to {PushPin}`)); return; }
  if (!p) p = pinned;
  now.replaceChildren(`${z} · `, ...(p === pinned ? [mui("PushPin", { class: "lead" })] : []), `(${p.x}, ${p.y})`);
  if (p.rgb) { const sw = document.createElement("i"); sw.style.background = `rgba(${p.rgb.slice(0, 3)},${p.rgb[3] / 255})`; now.append(sw, `${hex(p.rgb)} · RGB(${p.rgb.slice(0, 3).join(", ")})${p.rgb[3] < 255 ? ` · α ${p.rgb[3]}` : ""}`); }
}
function showImage(type) {
  const img = el = document.createElement("img");
  img.alt = name; img.draggable = false;
  img.onload = () => {
    if (!img.naturalWidth) img.style.width = "min(100%, 640px)";   // an SVG without width/height
    hint.className = "hint";
    hint.replaceChildren(muiText(`${img.naturalWidth}×${img.naturalHeight} · ${mb(size)}${type === "image/svg+xml" ? " · SVG (scripts do not run)" : ""}. Click to {PushPin} → {AttachFile} to quote position and color · ⌘ + wheel or + − 0 to zoom · drag to pan`));
    stage.hidden = false;
    if (type !== "image/svg+xml") try { const c = new OffscreenCanvas(img.naturalWidth, img.naturalHeight).getContext("2d", { willReadFrequently: true }); c.drawImage(img, 0, 0); px = c; } catch { px = null; }
    zoomImg(st.zoom); imgInfo(null);
  };
  img.onerror = () => err(`Could not read “${name}” as an image. You can download it.`);
  img.src = url;
  stage.className = `bg-${st.bg}`;
  stage.append(img, pin);
}
let drag = null;
stage.addEventListener("pointerdown", (e) => {
  if (kind !== "image" || e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop, moved: false };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (kind !== "image") return;
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; stage.classList.add("grabbing"); }
    if (drag.moved) { stage.scrollLeft = drag.l - dx; stage.scrollTop = drag.t - dy; return; }
  }
  imgInfo(pixelAt(e));
});
stage.addEventListener("pointerup", (e) => {
  if (kind !== "image" || !drag) return;
  const moved = drag.moved; drag = null; stage.classList.remove("grabbing");
  if (moved) return;
  const p = pixelAt(e);
  pinned = p && !(pinned && pinned.x === p.x && pinned.y === p.y) ? p : null;   // the same pixel again unpins
  placePin(); imgInfo(pinned); bar();
});
stage.addEventListener("pointerleave", () => kind === "image" && el?.naturalWidth && imgInfo(null));
stage.addEventListener("wheel", (e) => {
  if (kind !== "image" || !(e.metaKey || e.ctrlKey)) return;   // a plain wheel scrolls; a pinch arrives as Ctrl + wheel
  e.preventDefault();
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1 : -1, { x: e.clientX - r.left, y: e.clientY - r.top, cx: e.clientX - s.left, cy: e.clientY - s.top });
}, { passive: false });
new ResizeObserver(() => kind === "image" && el?.naturalWidth && (grabbable(), placePin(), st.zoom === "fit" && imgInfo(null))).observe(stage);

// ───────── video / audio ─────────
let fps = 0, lastMt = null, minDt = Infinity;
const frameOf = (t) => (fps ? Math.round(t * fps) : null);
const step = () => 1 / (fps || 30);
function avInfo() {
  const m = el, f = kind === "video" ? frameOf(m.currentTime) : null;
  now.textContent = `${fmt(m.currentTime)} / ${fmt(m.duration)}${f != null ? ` · frame ${f} / ${frameOf(m.duration)}` : ""} · ×${st.rate}${st.loop ? " · loop" : ""}`;
}
function avMeta() {
  const m = el;
  hint.className = "hint";
  hint.textContent = (kind === "video" ? `${m.videoWidth}×${m.videoHeight} · ${m.duration.toFixed(1)} s${fps ? ` · ${fps} fps` : ""}` : `Audio · ${m.duration.toFixed(1)} s`)
    + ` · ${mb(size)}. Space play · ← → 1 s${kind === "video" ? " · , . 1 frame" : ""} · L loop`;
}
// Frame rate: <video> does not tell it. Watch the presented frames while playing and keep the smallest step between them.
function watch(_, md) {
  if (el?.tagName !== "VIDEO") return;
  if (lastMt != null && md.mediaTime > lastMt) minDt = Math.min(minDt, md.mediaTime - lastMt);
  lastMt = md.mediaTime;
  const est = isFinite(minDt) ? Math.round(1 / minDt) : 0;
  if (est && est !== fps && est <= 240) { fps = est; avMeta(); }
  el.requestVideoFrameCallback(watch);
}
function showAV(type) {
  const my = gen, m = el = document.createElement(kind);
  m.controls = true; m.preload = "metadata"; m.loop = st.loop;
  if (kind === "video") { m.playsInline = true; m.requestVideoFrameCallback?.(watch); m.addEventListener("seeking", () => { lastMt = null; }); }
  m.addEventListener("loadedmetadata", () => { if (my !== gen) return; m.playbackRate = +st.rate; stage.hidden = false; avMeta(); avInfo(); bar(); }, { once: true });
  m.addEventListener("error", () => my === gen && err(`“${name}” is in a format this browser cannot play${kind === "video" ? " (e.g. HEVC .mov)" : ""}. Download it and open it elsewhere.`));
  m.addEventListener("ratechange", () => { const r = String(m.playbackRate); if (RATES.includes(r) && r !== st.rate) { st.rate = r; save(); bar(); } avInfo(); });
  ["timeupdate", "seeked", "durationchange"].forEach((e) => m.addEventListener(e, avInfo));
  m.src = url;
  stage.className = kind;
  if (kind === "audio") { const box = document.createElement("div"), d = document.createElement("div"); box.className = "abox"; d.className = "disc"; d.replaceChildren(mui("MusicNote")); box.append(d, m); stage.append(box); }
  else stage.append(m);
}
function seek(t) { el.pause(); el.currentTime = Math.min(Math.max(0, t), el.duration || 0); }
function setRate(r) { if (!RATES.includes(r)) return; st.rate = r; el.playbackRate = +r; save(); bar(); avInfo(); }
function setLoop(on) { st.loop = !!on; el.loop = st.loop; save(); bar(); avInfo(); }
function quoteNow() {
  const t = el.currentTime, f = kind === "video" ? frameOf(t) : null;
  aether.quote(`${name} @ ${fmt(t)}`, `${name} at ${t.toFixed(3)} s${f != null ? ` (frame ${f} · ${fps} fps)` : ""}`);
}

// ───────── bar ─────────
function bar() {
  const dl = { id: "dl", icon: "Download", label: "Download", title: `Download ${name}`, run: () => aether.download() };
  if (!url || !el) return aether.bar([dl]);
  if (kind === "image") return aether.bar([
    { id: "zoom", icon: "ZoomIn", label: "", title: "Zoom", select: true, value: st.zoom, options: ZOOMS.map((z) => ({ value: z, label: z === "fit" ? "Fit" : `${z * 100}%` })), run: (z) => zoomImg(z) },
    { id: "bg", label: "Background", select: true, value: st.bg, options: Object.entries(BGS).map(([value, label]) => ({ value, label })), run: (b) => { st.bg = b; save(); stage.classList.remove(...Object.keys(BGS).map((x) => `bg-${x}`)); stage.classList.add(`bg-${b}`); grabbable(); } },
    { id: "quote", icon: "AttachFile", label: "Quote pixel", title: pinned ? `Quote the position and color of (${pinned.x}, ${pinned.y})` : "Click the image to pin a pixel first", disabled: !pinned, run: quotePixel },
    dl,
  ]);
  aether.bar([
    ...(kind === "video" ? [{ id: "step", icon: "PlayArrow", label: "Step", title: "Step by 1 frame or 1 second (, . ← →)", options: [
      { value: "-f", icon: "NavigateBefore", label: "Back 1 frame" }, { value: "+f", icon: "NavigateNext", label: "Forward 1 frame" }, { value: "-s", icon: "FastRewind", label: "Back 1 s" }, { value: "+s", icon: "FastForward", label: "Forward 1 s" },
      { value: "0", icon: "SkipPrevious", label: "To start" }], run: (x) => x && (x === "0" ? seek(0) : seek(el.currentTime + (x[0] === "-" ? -1 : 1) * (x[1] === "f" ? step() : 1))) }] : []),
    { id: "rate", label: "Speed", select: true, value: st.rate, options: RATES.map((r) => ({ value: r, label: `×${r}` })), run: setRate },
    { id: "loop", icon: "Repeat", label: st.loop ? "Loop on" : "Loop off", title: "Start over at the end (L)", run: () => setLoop(!st.loop) },
    { id: "quote", icon: "AttachFile", label: "Quote time", title: "Quote the current time (and frame number for video)", run: quoteNow },
    dl,
  ]);
}

// ───────── open ─────────
aether.on("theme", (d) => document.body.classList.toggle("dark", !!d.dark));
aether.on("open", (d) => {
  gen++;
  if (el?.pause) { el.pause(); el.removeAttribute("src"); el.load(); }
  if (url) URL.revokeObjectURL(url);
  url = ""; el = null; px = null; pinned = null; pin.hidden = true; fps = 0; lastMt = null; minDt = Infinity;
  stage.replaceChildren(); stage.hidden = true; stage.className = ""; now.textContent = "";
  name = d.name;
  for (const k in st) if (d.state?.[k] !== undefined) st[k] = d.state[k];
  if (!RATES.includes(st.rate)) st.rate = "1";
  if (!ZOOMS.includes(st.zoom)) st.zoom = "fit";
  if (!BGS[st.bg]) st.bg = "check";
  bar();
  if (d.error) return err(`Could not open “${name}” (${d.error}). You can download it.`);
  const [k, type] = kindOf(name);
  if (!k) return err(`“${name}” is not a type this preview handles.`);
  kind = k; size = d.data.byteLength;
  url = URL.createObjectURL(new Blob([d.data], { type }));
  hint.className = "hint"; hint.innerHTML = '<span class="spin"></span>Loading…';
  kind === "image" ? showImage(type) : showAV(type);
});

document.addEventListener("keydown", (e) => {
  if (!url || !el || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (kind === "image") {
    if (k === "+" || k === "=") zoomBy(1); else if (k === "-") zoomBy(-1); else if (k === "0") zoomImg("fit"); else return;
  } else if (k === " ") { el.paused ? el.play() : el.pause(); }
  else if (k === "ArrowLeft" || k === "ArrowRight") seek(el.currentTime + (k === "ArrowLeft" ? -1 : 1));
  else if (kind === "video" && (k === "," || k === ".")) seek(el.currentTime + (k === "," ? -1 : 1) * step());
  else if (k === "l" || k === "L") setLoop(!st.loop);
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
